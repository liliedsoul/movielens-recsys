[project]
name = "movielens-recsys"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Лейла", email = "ll12041204ll@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.67.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]

[project.scripts]
movielens-recsys = "movielens_recsys:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
